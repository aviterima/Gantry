<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last-Z Mission Control</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --panel2:#1d242f; --line:#2a3341;
    --text:#e6ebf2; --muted:#8b98aa; --accent:#4da3ff; --good:#3ecf8e;
    --warn:#f5b83d; --bad:#f2635d; --chip:#232c39;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;letter-spacing:.4px}
  header .sub{color:var(--muted);font-size:12.5px}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 28px 60px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .num{font-size:24px;font-weight:650}
  .tile .lbl{color:var(--muted);font-size:12px;margin-top:2px}
  nav.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  nav.tabs button{background:none;border:none;color:var(--muted);font:inherit;font-weight:600;
    padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent}
  nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--muted)}
  .chip.b{color:var(--text)}
  .st{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    border-radius:5px;padding:2px 8px}
  .st.scored{background:#153a5e;color:var(--accent)}
  .st.draft{background:#333c49;color:var(--muted)}
  .st.untestable{background:#4a2320;color:var(--bad)}
  .st.g0_approved{background:#173d2e;color:var(--good)}
  .st.g0_rejected{background:#3c3220;color:var(--warn)}
  button.act{background:var(--accent);color:#08131f;border:none;border-radius:7px;
    padding:7px 14px;font:inherit;font-weight:650;cursor:pointer}
  button.act.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.act.danger{background:var(--bad);color:#1c0908}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--panel2)}
  .muted{color:var(--muted)}
  .blockers{color:var(--warn);font-size:12.5px;margin-top:6px}
  .memo{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:14px;white-space:pre-wrap;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    max-height:420px;overflow:auto}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 9px;font:inherit;width:100%}
  textarea{resize:vertical;min-height:34px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .scoretbl input[type=number]{width:60px}
  .gatehint{font-size:11px;color:var(--warn)}
  .overflow{overflow-x:auto}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:12px;max-width:560px;width:92%;padding:20px 22px}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:10px 16px;display:none;max-width:420px}
</style>
</head>
<body>
<header>
  <h1>LAST-Z &nbsp;/ &nbsp;Mission Control</h1>
  <span class="sub">Phase 1 — Selection Engine · candidate intake → G0</span>
</header>
<div class="wrap">
  <div class="tiles" id="tiles"></div>
  <nav class="tabs">
    <button data-tab="queue" class="active">G0 Queue</button>
    <button data-tab="registry">Registry</button>
    <button data-tab="config">Configuration</button>
  </nav>
  <div id="pane"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const api = async (path, opts) => {
  const r = await fetch('/api' + path, opts ? {
    headers:{'Content-Type':'application/json'},
    method: opts.method || 'POST',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  } : undefined);
  if (!r.ok) { const e = await r.json().catch(()=>({detail:r.statusText}));
    throw new Error(e.detail || r.statusText); }
  return r.json();
};

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab = 'queue', detailSlug = null;

function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = isErr ? 'var(--bad)' : 'var(--good)';
  t.style.display = 'block'; setTimeout(()=> t.style.display='none', 3800);
}

const STATUS_LABEL = {draft:'Draft', scored:'Scored — in queue', untestable:'Untestable',
  g0_approved:'G0 Approved', g0_rejected:'G0 Rejected'};
const LANE = {substitution:'Lane 1 · Substitution', vertical:'Lane 2 · Vertical'};
const MODE = {service_first:'Service-first', self_serve:'Self-serve'};

async function refresh(){
  const s = await api('/summary');
  $('#tiles').innerHTML = [
    [s.candidates,'Candidates'], [s.g0_queue,'Ready for G0'],
    [s.by_status.untestable,'Untestable'], [s.by_status.g0_approved,'Approved'],
    [s.clusters,'Clusters'], [s.operators,'Operators'],
  ].map(([n,l])=>`<div class="tile"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
  if (tab==='queue') renderQueue();
  else if (tab==='registry') renderRegistry();
  else renderConfig();
}

document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab = b.dataset.tab; detailSlug = null; refresh();
});

/* ---------- G0 Queue (Control pane) ---------- */
async function renderQueue(){
  const items = await api('/g0-queue');
  if (!items.length){ $('#pane').innerHTML = '<p class="muted">Queue is empty — score a draft candidate in the Registry.</p>'; return; }
  $('#pane').innerHTML = items.map(c => `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h3>${esc(c.name)} <span class="st ${c.status}">${STATUS_LABEL[c.status]}</span></h3>
          <div class="muted">${esc(c.one_liner)}</div>
          <div class="row" style="margin-top:8px">
            <span class="chip b">${LANE[c.lane]}</span><span class="chip b">${MODE[c.delivery_mode]}</span>
            <span class="chip">score ${c.total_score}/50</span>
            <span class="chip">cluster: ${esc(c.cluster || 'exception')}</span>
            <span class="chip">operator: ${esc(c.operator || 'exception')}</span>
          </div>
          ${c.blockers.length ? `<div class="blockers">⚠ ${c.blockers.map(esc).join(' · ')}</div>` : ''}
        </div>
        <div class="row">
          <button class="act sec" onclick="openDetail('${c.slug}')">Memo</button>
          <button class="act" ${c.decidable?'':'disabled'} onclick="decide('${c.slug}', true)">Approve G0</button>
          <button class="act danger" onclick="decide('${c.slug}', false)">Reject</button>
        </div>
      </div>
    </div>`).join('');
}

async function decide(slug, approved){
  const notes = prompt(approved ? 'Approval notes:' : 'Rejection rationale:') ?? '';
  try {
    await api(`/candidates/${slug}/decision`, {body:{approved, decided_by:'studio-review', notes}});
    toast(`${slug} ${approved?'approved':'rejected'} at G0`); refresh();
  } catch(e){ toast(e.message, true); }
}

/* ---------- Registry ---------- */
async function renderRegistry(){
  if (detailSlug) return renderDetail(detailSlug);
  const items = await api('/candidates');
  $('#pane').innerHTML = `
    <div class="card overflow"><table>
      <tr><th>Candidate</th><th>Lane / Mode</th><th>Cluster</th><th>Operator</th><th>Score</th><th>Status</th></tr>
      ${items.map(c=>`<tr class="click" onclick="openDetail('${c.slug}')">
        <td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.one_liner)}</span></td>
        <td>${LANE[c.lane]}<br><span class="muted">${MODE[c.delivery_mode]}</span></td>
        <td>${esc(c.cluster || '—')}</td><td>${esc(c.operator || '—')}</td>
        <td>${c.total_score}/50</td>
        <td><span class="st ${c.status}">${STATUS_LABEL[c.status]}</span></td></tr>`).join('')}
    </table></div>`;
}

function openDetail(slug){ tab='registry'; detailSlug=slug;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='registry'));
  renderDetail(slug);
}

async function renderDetail(slug){
  const c = await api(`/candidates/${slug}`);
  const locked = !!c.decision;
  const dims = c.scorecard.dimensions || {};
  const DIMS = ['pain_intensity','buyer_reachability','time_to_signal','budget_existence',
    'incumbent_exposure','ai_leverage','moat_trajectory','founder_market_access',
    'expansion_path','portfolio_synergy'];
  const GATING = ['buyer_reachability','time_to_signal'];
  $('#pane').innerHTML = `
    <button class="act sec" onclick="detailSlug=null;renderRegistry()">← All candidates</button>
    <div class="card" style="margin-top:12px">
      <h3>${esc(c.name)} <span class="st ${c.status}">${STATUS_LABEL[c.status]}</span></h3>
      <div class="muted">${esc(c.one_liner)}</div>
      <div class="row" style="margin-top:8px">
        <span class="chip b">${LANE[c.lane]}</span><span class="chip b">${MODE[c.delivery_mode]}</span>
        <span class="chip">persona: ${esc(c.persona||'—')}</span>
        <span class="chip">channel: ${esc(c.channel||'—')}</span>
      </div>
      ${c.blockers.length ? `<div class="blockers">⚠ ${c.blockers.map(esc).join(' · ')}</div>` : ''}
    </div>
    <div class="card">
      <h3>Scorecard ${locked?'<span class="muted">(locked by G0 decision)</span>':''}</h3>
      <div class="overflow"><table class="scoretbl">
        <tr><th>Dimension</th><th>Score</th><th>Evidence ${''}</th></tr>
        ${DIMS.map(d=>`<tr>
          <td>${d}${GATING.includes(d)?' <span class="gatehint">gating ≥3 + evidence</span>':''}</td>
          <td><input type="number" min="1" max="5" id="s_${d}" value="${dims[d]?dims[d].score:''}" ${locked?'disabled':''}></td>
          <td><textarea id="e_${d}" ${locked?'disabled':''}>${esc(dims[d]?dims[d].evidence:'')}</textarea></td>
        </tr>`).join('')}
      </table></div>
      ${locked?'':`<div style="margin-top:12px"><button class="act" onclick="saveScores('${c.slug}')">Save scorecard</button></div>`}
    </div>
    <div class="card">
      <h3>Pre-committed thresholds ${locked?'<span class="muted">(locked at G0 — extension-memo flow only)</span>':''}</h3>
      <label>G1 reachability</label><input id="t_g1" value="${esc(c.thresholds.g1_reachability)}" ${locked?'disabled':''}>
      <label>G2 engagement</label><input id="t_g2" value="${esc(c.thresholds.g2_engagement)}" ${locked?'disabled':''}>
      <label>G3 retention</label><input id="t_g3" value="${esc(c.thresholds.g3_retention)}" ${locked?'disabled':''}>
      <div class="grid2">
        <div><label>Budget cap (USD)</label><input type="number" id="t_budget" value="${c.thresholds.budget_cap_usd}" ${locked?'disabled':''}></div>
        <div><label>Time cap (weeks)</label><input type="number" id="t_weeks" value="${c.thresholds.time_cap_weeks}" ${locked?'disabled':''}></div>
      </div>
      ${locked?'':`<div style="margin-top:12px"><button class="act" onclick="saveThresholds('${c.slug}')">Save thresholds</button></div>`}
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3>G0 memo</h3>
        <button class="act sec" onclick="regen('${c.slug}')">Regenerate draft</button>
      </div>
      <div class="memo">${esc(c.memo || '— no memo yet —')}</div>
    </div>`;
}

async function saveScores(slug){
  const dims = {};
  document.querySelectorAll('[id^="s_"]').forEach(inp=>{
    const d = inp.id.slice(2), v = parseInt(inp.value,10);
    if (v>=1 && v<=5) dims[d] = {score:v, evidence: $('#e_'+d).value};
  });
  try { await api(`/candidates/${slug}/score`, {body:{dimensions:dims}});
    toast('Scorecard saved — status recomputed'); refresh(); renderDetail(slug);
  } catch(e){ toast(e.message, true); }
}

async function saveThresholds(slug){
  try { await api(`/candidates/${slug}/thresholds`, {body:{
      g1_reachability: $('#t_g1').value, g2_engagement: $('#t_g2').value,
      g3_retention: $('#t_g3').value,
      budget_cap_usd: parseInt($('#t_budget').value,10)||0,
      time_cap_weeks: parseInt($('#t_weeks').value,10)||0 }});
    toast('Thresholds saved'); renderDetail(slug);
  } catch(e){ toast(e.message, true); }
}

async function regen(slug){
  try { await api(`/candidates/${slug}/memo`, {body:{}}); toast('Memo regenerated'); renderDetail(slug); }
  catch(e){ toast(e.message, true); }
}

/* ---------- Configuration ---------- */
async function renderConfig(){
  const [clusters, operators] = await Promise.all([api('/clusters'), api('/operators')]);
  $('#pane').innerHTML = `
    <div class="card">
      <h3>Audience clusters</h3>
      <p class="muted" style="margin:4px 0 10px">Durable shared assets — list, trust, community presence — that launches compound (FRAMEWORK §5).</p>
      <table><tr><th>Cluster</th><th>Description</th><th>Watering holes</th></tr>
      ${clusters.map(cl=>`<tr><td><b>${esc(cl.name)}</b><br><span class="muted">${cl.slug}</span></td>
        <td>${esc(cl.description)}</td><td>${cl.watering_holes.map(esc).join('<br>')}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <h3>Operator bench</h3>
      <p class="muted" style="margin:4px 0 10px">Matched at G0; hands-on at the G2 concentration trigger; founder equity from day one.</p>
      <table><tr><th>Operator</th><th>Domain profile</th><th>Load</th></tr>
      ${operators.map(o=>`<tr><td><b>${esc(o.name)}</b><br><span class="muted">${o.slug}</span></td>
        <td>${esc(o.domain_profile)}</td><td>${o.load}</td></tr>`).join('')}
      </table>
    </div>
    <div class="card">
      <h3>Adapters <span class="muted">(Phase 2)</span></h3>
      <div class="row">
        <span class="chip">Neubloc · email — <i>not yet connected</i></span>
        <span class="chip">Vox · social — <i>listening stub</i></span>
        <span class="chip">Forum · CRM — <i>not yet connected</i></span>
      </div>
    </div>`;
}

refresh();
</script>
</body>
</html>
