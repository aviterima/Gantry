name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m ruff check engine
      - run: python -m ruff format --check engine
      - run: python -m mypy
      - name: Generate and verify shared API contract
        run: |
          python -m engine.export_contract
          git diff --exit-code -- deploy/cloudflare/src/contracts.json deploy/cloudflare/src/dimensions.json
          node scripts/build-validators.mjs
      - run: python -m pytest engine/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:operations
      - run: npm run test:ui
      - name: Build Worker without deploying
        run: npm run build:worker
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Seed smoke test
        run: GANTRY_DATA_DIR=/tmp/gantry-ci-data python -m engine.seed
      - name: Reject committed bytecode
        run: test -z "$(git ls-files '*.pyc')"
