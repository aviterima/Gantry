name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: "One-off Cloudflare API token (optional; normally use the CLOUDFLARE_API_TOKEN repo secret)"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "deploy/cloudflare/**"
      - "engine/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No Cloudflare token: set the CLOUDFLARE_API_TOKEN repository secret (Settings -> Secrets and variables -> Actions) or pass the workflow input."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy/cloudflare/deploy.sh
