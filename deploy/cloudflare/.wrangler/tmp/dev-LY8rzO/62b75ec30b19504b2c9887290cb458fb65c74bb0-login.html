<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gantry — Sign in</title>
<style>
  :root{--bg:#0e1116;--panel:#161b23;--line:#2a3341;--text:#e6ebf2;--muted:#8b98aa;
    --accent:#4da3ff;--bad:#f2635d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 32px;width:min(380px,92vw)}
  h1{font-size:16px;margin:0 0 4px;letter-spacing:1.2px}
  h1 .z{color:var(--accent)}
  p{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  input{width:100%;background:#10141b;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:10px 12px;font:inherit}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:12px;background:var(--accent);color:#08131f;border:none;border-radius:8px;
    padding:10px;font:600 14px inherit;cursor:pointer}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
  <form class="card" onsubmit="signin(event)">
    <h1>GANTRY <span class="z">/</span> MISSION CONTROL</h1>
    <p>Sign in with your email. Access is allowlist-only — no password.</p>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required autofocus>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
async function signin(e){
  e.preventDefault();
  document.getElementById('err').textContent = '';
  const r = await fetch('/api/login', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: document.getElementById('email').value})});
  if (r.ok) { location.href = '/'; }
  else {
    const d = await r.json().catch(()=>({detail:'Sign-in failed.'}));
    document.getElementById('err').textContent = d.detail;
  }
}
</script>
</body>
</html>
