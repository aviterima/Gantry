slug: ledgerlite
name: LedgerLite
one_liner: De-configured, AI-native fund administration for micro-VCs and syndicates
  priced at 1/10th of the legacy fund-admin stack.
lane: substitution
delivery_mode: self_serve
persona: GP or ops lead at a sub-$50M fund or active syndicate, no back office.
channel: Founder/VC social (Vox), emerging-manager communities, targeted outbound.
cluster: null
cluster_exception: Substitution-lane launch; buyer pool (emerging managers) doesn't
  map to a current cluster. Revisit if a fintech cluster forms.
operator: sam-okafor
operator_exception: ''
case_against: 'Fund admin is a trust purchase: emerging managers may pay legacy premiums
  precisely because LPs recognize the name, and ''cheap + AI'' could read as audit
  risk rather than efficiency.'
kill_criterion: Kill if >=3 qualified GPs cite LP acceptance as the blocker and none
  converts after we provide an LP-facing assurance letter.
scorecard:
  dimensions:
    pain_intensity:
      score: 4
      evidence: Emerging managers defer admin until an LP or audit forces it.
    buyer_reachability:
      score: 4
      evidence: Form D filings are public; emerging-manager communities are dense.
    time_to_signal:
      score: 3
      evidence: Self-serve signups fast; paid conversion tied to quarter-end cycles.
    budget_existence:
      score: 5
      evidence: They already pay $15-40k/yr to legacy fund admins.
    incumbent_exposure:
      score: 3
      evidence: Legacy admins could ship a cheap tier, but their cost base resists
        it.
    ai_leverage:
      score: 4
      evidence: AI handles capital-call docs, K-1 prep support, LP reporting.
    moat_trajectory:
      score: 3
      evidence: Workflow embedding and multi-year records; weaker data moat.
    founder_market_access:
      score: 3
      evidence: Sam is a generalist; no deep fund-admin background on bench.
    expansion_path:
      score: 4
      evidence: Tax docs, LP portal, compliance calendar.
    portfolio_synergy:
      score: 3
      evidence: Reuses launch stack; no cluster sharing.
thresholds:
  g1_reachability: ≥3% qualified signup rate on 1,000 targeted contacts
  g2_engagement: ≥35% of signups complete fund setup and issue one capital call
  g3_retention: ≥4 paying funds, ≥1 from pure outbound, ≥1 renewal into a second quarter
  budget_cap_usd: 2000
  time_cap_weeks: 3
decision: null
